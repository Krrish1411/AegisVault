name: Build Android APK (Debug & Release)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug-only
          - release-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0 platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Install ALL dependencies including @capacitor/* devDeps
      - name: Install NPM Dependencies
        run: npm ci

      - name: Verify TypeScript & Run Tests
        run: |
          npm run typecheck
          npx vitest run

      # IMPORTANT: must use build:android so vite uses --mode android
      # which sets base: './' for Capacitor WebView relative asset paths
      - name: Build Production Web Bundle (Android mode)
        run: npm run build:android

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Verify Signing Keystore
        run: |
          cd android/app
          # Check if existing keystore contains a valid PrivateKeyEntry with alias 'aegisvault'
          if ! keytool -list -v -keystore aegisvault-release.keystore -storepass aegisvault2026 -alias aegisvault 2>&1 | grep -q "PrivateKeyEntry"; then
            echo "⚠️ Generating standard PKCS12 release keystore via Java keytool..."
            rm -f aegisvault-release.keystore
            keytool -genkeypair -v \
              -keystore aegisvault-release.keystore \
              -storetype PKCS12 \
              -alias aegisvault \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass aegisvault2026 \
              -keypass aegisvault2026 \
              -dname "CN=AegisVault, O=AegisVault, C=US"
          fi
          # Also ensure keystore is copied to android/ root directory as fallback
          cp aegisvault-release.keystore ../aegisvault-release.keystore
          echo "✅ Keystore verified and synchronized successfully"

      - name: Cache Gradle Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (Signed)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'all' || inputs.build_type == 'debug-only' }}
        run: |
          cd android
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee debug_build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "### ❌ Debug Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 debug_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ERR_MSG=$(grep -A 3 "\* What went wrong:" debug_build.log | tail -n +2 | tr '\n' ' ')
            [ -z "$ERR_MSG" ] && ERR_MSG=$(tail -n 5 debug_build.log | tr '\n' ' ')
            echo "::error title=Debug Build Failure::$ERR_MSG"
            exit $STATUS
          fi

      - name: Build Release APK (Signed & Obfuscated)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'all' || inputs.build_type == 'release-only' }}
        run: |
          cd android
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee release_build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "### ❌ Release Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 release_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ERR_MSG=$(grep -A 3 "\* What went wrong:" release_build.log | tail -n +2 | tr '\n' ' ')
            [ -z "$ERR_MSG" ] && ERR_MSG=$(tail -n 5 release_build.log | tr '\n' ' ')
            echo "::error title=Release Build Failure::$ERR_MSG"
            exit $STATUS
          fi

      - name: Collect APK Artifacts
        run: |
          mkdir -p build-artifacts
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/AegisVault-Debug.apk
            echo "✅ Debug APK collected"
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/AegisVault-Release.apk
            echo "✅ Release APK collected"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/AegisVault-Release-unsigned.apk
            echo "✅ Release (unsigned) APK collected"
          fi
          if [ -f "android/app/aegisvault-release.keystore" ]; then
            cp android/app/aegisvault-release.keystore build-artifacts/aegisvault-release.keystore
            echo "✅ Release Keystore collected"
          fi
          echo "--- Build artifacts ---"
          ls -lh build-artifacts/

      - name: Upload Android APK & Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AegisVault-Android-APKs-${{ github.run_number }}
          path: build-artifacts/*
          retention-days: 30

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-logs-${{ github.run_number }}
          path: |
            android/*.log
            android/app/build/reports

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*
          name: AegisVault ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
